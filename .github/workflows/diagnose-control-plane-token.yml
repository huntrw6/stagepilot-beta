name: Diagnose Scoped Control Plane Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: stagepilot-control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TUNNEL_ID: 29774cdd-fda5-459c-976a-68ccb5cf8a88
      DNS_ID: 5da10bf489253ea6308fe5e48d917ab0
      HOSTNAME: sp-c85e14c70d25df528eee82c1f2e45931.illuminary.studio
      TUNNEL_NAME: stagepilot-c85e14c70d25df528eee82c1f2e45931-4b089138-927b-4f90-9268-f5f5a3cce0de
      CONTROL_PLANE_ORIGIN: https://stagepilot-beta-control-plane.stagepilot-illuminary-beta.workers.dev
    steps:
      - name: Verify exact provider capabilities without response bodies
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          tunnel_list=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false")
          tunnel_token=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token")
          dns_list=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "$auth" "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=$HOSTNAME")
          body=$(jq -cn --arg name "$HOSTNAME" --arg content "$TUNNEL_ID.cfargotunnel.com" --arg comment "$TUNNEL_NAME" '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1,comment:$comment}')
          dns_exact_patch=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request PATCH --header "$auth" --header 'Content-Type: application/json' --data "$body" "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records/$DNS_ID")
          printf 'tunnel_list_http=%s\ntunnel_token_http=%s\ndns_list_http=%s\ndns_exact_patch_http=%s\n' "$tunnel_list" "$tunnel_token" "$dns_list" "$dns_exact_patch"
          test "$tunnel_list" = 200
          test "$tunnel_token" = 200
          test "$dns_list" = 200
          test "$dns_exact_patch" = 200
      - name: Capture secret-safe reconciliation diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tail_log="$RUNNER_TEMP/control-plane-tail.jsonl"
          enrollment="$RUNNER_TEMP/enrollment.json"
          npx --yes wrangler@4.100.0 tail stagepilot-beta-control-plane --format json >"$tail_log" 2>/dev/null &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true; rm -f "$enrollment"' EXIT
          sleep 8
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $ADMIN_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"idempotencyKey":"live-a-34756660793","label":"Disposable live acceptance A"}' \
            "$CONTROL_PLANE_ORIGIN/v1/admin/installations" >"$enrollment"
          credential=$(jq -er .installationCredential "$enrollment")
          reconcile_http=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $credential" --header 'Content-Type: application/json' \
            --data '{}' "$CONTROL_PLANE_ORIGIN/v1/installations/c85e14c70d25df528eee82c1f2e45931/reconcile")
          sleep 8
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          printf 'reconcile_http=%s\n' "$reconcile_http"
          jq -r '.logs[]?.message[]? // empty' "$tail_log"
