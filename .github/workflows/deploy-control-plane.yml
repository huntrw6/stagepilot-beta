name: Deploy Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: stagepilot-control-plane
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      REMOTE_HOST_SUFFIX: ${{ vars.REMOTE_HOST_SUFFIX }}
      REMOTE_PORT: ${{ vars.REMOTE_PORT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      INSTALLATION_SIGNING_KEY: ${{ secrets.INSTALLATION_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci --prefix control-plane
      - name: Validate protected deployment configuration
        run: node control-plane/scripts/deployment-config.mjs validate
      - name: Build a deployment preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: control-plane
          command: >-
            deploy --dry-run
            --var CLOUDFLARE_ACCOUNT_ID:${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            --var CLOUDFLARE_ZONE_ID:${{ vars.CLOUDFLARE_ZONE_ID }}
            --var REMOTE_HOST_SUFFIX:${{ vars.REMOTE_HOST_SUFFIX }}
            --var REMOTE_PORT:${{ vars.REMOTE_PORT }}
      - name: Deploy and install Worker runtime secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: control-plane
          command: >-
            deploy
            --var CLOUDFLARE_ACCOUNT_ID:${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            --var CLOUDFLARE_ZONE_ID:${{ vars.CLOUDFLARE_ZONE_ID }}
            --var REMOTE_HOST_SUFFIX:${{ vars.REMOTE_HOST_SUFFIX }}
            --var REMOTE_PORT:${{ vars.REMOTE_PORT }}
          secrets: |
            CLOUDFLARE_API_TOKEN
            ADMIN_API_TOKEN
            INSTALLATION_SIGNING_KEY
      - name: Read back Worker runtime secret names
        id: runtime-secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: control-plane
          command: secret list --format json
      - name: Verify every Worker runtime secret is installed
        env:
          WRANGLER_SECRET_LIST: ${{ steps.runtime-secrets.outputs.command-output }}
        run: node control-plane/scripts/deployment-config.mjs verify-secrets
