name: Prepare Private Live Acceptance Bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enroll:
    runs-on: ubuntu-latest
    environment: stagepilot-control-plane
    env:
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      CONTROL_PLANE_ORIGIN: https://stagepilot-beta-control-plane.stagepilot-illuminary-beta.workers.dev
      REMOTE_PORT: ${{ vars.REMOTE_PORT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci --prefix control-plane
      - name: Enroll two disposable installations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/admin-token"
          bundle_dir="$RUNNER_TEMP/stagepilot-live-bundles"
          mkdir -m 700 "$bundle_dir"
          trap 'rm -f "$token_file"' EXIT
          printf '%s' "$ADMIN_API_TOKEN" > "$token_file"
          npm --prefix control-plane run enroll:bootstrap -- \
            --origin "$CONTROL_PLANE_ORIGIN" \
            --idempotency-key "live-a-${GITHUB_RUN_ID}" \
            --label "Disposable live acceptance A" \
            --remote-port "$REMOTE_PORT" \
            --output "$bundle_dir/a.bootstrap.json" \
            --admin-token-file "$token_file"
          npm --prefix control-plane run enroll:bootstrap -- \
            --origin "$CONTROL_PLANE_ORIGIN" \
            --idempotency-key "live-b-${GITHUB_RUN_ID}" \
            --label "Disposable live acceptance B" \
            --remote-port "$REMOTE_PORT" \
            --output "$bundle_dir/b.bootstrap.json" \
            --admin-token-file "$token_file"
          test "$(stat -c '%a' "$bundle_dir/a.bootstrap.json")" = 600
          test "$(stat -c '%a' "$bundle_dir/b.bootstrap.json")" = 600
      - name: Upload private short-lived bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: stagepilot-live-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/stagepilot-live-bundles/*.bootstrap.json
          if-no-files-found: error
          retention-days: 1
