name: Revoke Disposable Control Plane Installation

on:
  workflow_dispatch:
    inputs:
      installation:
        description: Disposable installation label
        required: true
        type: choice
        options:
          - a
          - b

permissions:
  contents: read

jobs:
  revoke:
    runs-on: ubuntu-latest
    environment: stagepilot-control-plane
    env:
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      CONTROL_PLANE_ORIGIN: https://stagepilot-beta-control-plane.stagepilot-illuminary-beta.workers.dev
    steps:
      - name: Revoke exact disposable installation
        shell: bash
        env:
          INSTALLATION: ${{ inputs.installation }}
        run: |
          set -euo pipefail
          case "$INSTALLATION" in
            a) installation_id=c85e14c70d25df528eee82c1f2e45931 ;;
            b) installation_id=17366e5e772309b14936150b12afa76e ;;
            *) exit 2 ;;
          esac
          response="$RUNNER_TEMP/revoke.json"
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer $ADMIN_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$CONTROL_PLANE_ORIGIN/v1/admin/installations/$installation_id/revoke" >"$response"
          jq -e --arg id "$installation_id" '.installationId == $id and .phase == "disabled" and .revoked == true' "$response" >/dev/null
          jq '{installationId,hostname,phase,generation,revoked,updatedAt}' "$response"
